<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1160" viewBox="0 0 1440 1160"><rect width="1440" height="1160" fill="#edf2f7"/><style>text{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#263d55}.title{font-size:38px;font-weight:700}.name{font-size:21px;font-weight:700}.unit{font-size:29px;font-weight:700}.body{font-size:18px}.small{font-size:16px}</style><text x="60" y="65" class="title">數晶傳說｜康軒四上關卡設計圖</text><text x="60" y="103" class="body">九座島 × 十小關＝90 關｜第九島涵蓋第九、十單元｜保留既有冒險進度</text><g transform="translate(55 140)"><rect width="430" height="220" rx="22" fill="white" stroke="#cbd6e2"/><rect width="430" height="9" rx="4" fill="#79a782"/><text x="22" y="44" class="name">01 晨光原野</text><text x="22" y="87" class="unit">一億以內的數</text><text x="22" y="126" class="body">大數位值、讀數、加減</text><text x="22" y="163" class="small">01–03 位值｜04–09 加減｜10 守關</text><text x="22" y="198" class="small">守關成功 → 解鎖下一島</text></g><g transform="translate(505 140)"><rect width="430" height="220" rx="22" fill="white" stroke="#cbd6e2"/><rect width="430" height="9" rx="4" fill="#79a782"/><text x="22" y="44" class="name">02 雲絮高地</text><text x="22" y="87" class="unit">整數的乘法</text><text x="22" y="126" class="body">三位數乘一、二位數</text><text x="22" y="163" class="small">01–03 基礎｜04–09 混合｜10 守關</text><text x="22" y="198" class="small">守關成功 → 解鎖下一島</text></g><g transform="translate(955 140)"><rect width="430" height="220" rx="22" fill="white" stroke="#cbd6e2"/><rect width="430" height="9" rx="4" fill="#79a782"/><text x="22" y="44" class="name">03 珊瑚海岸</text><text x="22" y="87" class="unit">角度</text><text x="22" y="126" class="body">量角、角分類、畫角、合成</text><text x="22" y="163" class="small">01–03 量角｜04–07 分類與畫角｜08–10 合成</text><text x="22" y="198" class="small">守關成功 → 解鎖下一島</text></g><g transform="translate(55 385)"><rect width="430" height="220" rx="22" fill="white" stroke="#cbd6e2"/><rect width="430" height="9" rx="4" fill="#899ec3"/><text x="22" y="44" class="name">04 翠竹秘境</text><text x="22" y="87" class="unit">整數的除法</text><text x="22" y="126" class="body">四位除一位、三位除二位</text><text x="22" y="163" class="small">01–03 基礎｜04–09 混合｜10 守關</text><text x="22" y="198" class="small">守關成功 → 解鎖下一島</text></g><g transform="translate(505 385)"><rect width="430" height="220" rx="22" fill="white" stroke="#cbd6e2"/><rect width="430" height="9" rx="4" fill="#899ec3"/><text x="22" y="44" class="name">05 燈火遺跡</text><text x="22" y="87" class="unit">公里</text><text x="22" y="126" class="body">公里公尺換算、距離應用</text><text x="22" y="163" class="small">01–03 換算｜04–09 應用｜10 守關</text><text x="22" y="198" class="small">守關成功 → 解鎖下一島</text></g><g transform="translate(955 385)"><rect width="430" height="220" rx="22" fill="white" stroke="#cbd6e2"/><rect width="430" height="9" rx="4" fill="#899ec3"/><text x="22" y="44" class="name">06 月影森林</text><text x="22" y="87" class="unit">三角形</text><text x="22" y="126" class="body">依邊與角分類三角形</text><text x="22" y="163" class="small">01–04 邊分類｜05–08 角分類｜09–10 混合</text><text x="22" y="198" class="small">守關成功 → 解鎖下一島</text></g><g transform="translate(55 630)"><rect width="430" height="220" rx="22" fill="white" stroke="#cbd6e2"/><rect width="430" height="9" rx="4" fill="#60b2c2"/><text x="22" y="44" class="name">07 風車峽谷</text><text x="22" y="87" class="unit">小數</text><text x="22" y="126" class="body">二位小數、加減與應用</text><text x="22" y="163" class="small">01–03 基礎｜04–09 混合｜10 守關</text><text x="22" y="198" class="small">守關成功 → 解鎖下一島</text></g><g transform="translate(505 630)"><rect width="430" height="220" rx="22" fill="white" stroke="#cbd6e2"/><rect width="430" height="9" rx="4" fill="#60b2c2"/><text x="22" y="44" class="name">08 熔岩火山</text><text x="22" y="87" class="unit">整數四則運算</text><text x="22" y="126" class="body">先乘除後加減、括號</text><text x="22" y="163" class="small">01–03 基礎｜04–09 混合｜10 守關</text><text x="22" y="198" class="small">守關成功 → 解鎖下一島</text></g><g transform="translate(955 630)"><rect width="430" height="220" rx="22" fill="white" stroke="#cbd6e2"/><rect width="430" height="9" rx="4" fill="#60b2c2"/><text x="22" y="44" class="name">09 極光王座</text><text x="22" y="87" class="unit">分數 ＋ 統計圖</text><text x="22" y="126" class="body">帶分數、同分母運算、讀圖比較</text><text x="22" y="163" class="small">01–05 分數｜06–09 統計｜10 雙單元守關</text><text x="22" y="198" class="small">完成全部單元 → 綜合修練</text></g><rect x="55" y="900" width="1330" height="200" rx="20" fill="#253e58"/><g fill="white"><text x="80" y="940" class="name" style="fill:white">修練路線｜自由選十單元／錯題複習</text><text x="80" y="980" class="body" style="fill:white">等級 Lv.1＋⌊經驗÷100⌋；每 600 經驗提高一階難度，最多四階，可手動降低。</text><text x="80" y="1018" class="body" style="fill:white">戰鬥：答對三題 → 夥伴追擊＋屬性融合；一擊必殺 → 經驗＋30、能力點＋20。</text><text x="80" y="1056" class="body" style="fill:white">能力每 100 點進化，最多四次。此圖為遊戲單元配置，非教科書完整小節覆蓋證明。</text></g></svg>